name: 构建单文件 EXE

on:
  push:
    paths:
      - "exe_src/**"
      - ".github/workflows/build-exe.yml"
  pull_request:
    paths:
      - "exe_src/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:
    inputs:
      commit_binary:
        description: "把构建好的 EXE 提交回 exe_bin/（PR 前更新 bin 用）"
        type: boolean
        default: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  build:
    name: Windows 打包
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: exe_src/requirements.txt

      - name: 准备 Node（对拍测试需要，用来跑 HTML 版引擎）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        working-directory: exe_src
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 运行测试（含与 HTML 版的数值对拍）
        working-directory: exe_src
        shell: bash
        run: |
          set +e
          python -m pytest tests -q --tb=short > pytest.log 2>&1
          code=$?
          cat pytest.log
          if [ $code -ne 0 ]; then
            # 把失败详情写进 annotation，方便在 Actions 概览页直接看到
            msg=$(tail -c 3000 pytest.log | python -c "import sys;print(sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
            echo "::error title=测试失败::$msg"
          fi
          exit $code

      - name: 打包 EXE
        working-directory: exe_src
        shell: bash
        run: |
          set +e
          python build.py --skip-tests > build.log 2>&1
          code=$?
          cat build.log
          if [ $code -ne 0 ]; then
            msg=$(tail -c 3000 build.log | python -c "import sys;print(sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))")
            echo "::error title=打包失败::$msg"
          fi
          exit $code

      - name: 读取版本号
        id: meta
        shell: bash
        run: |
          version=$(python -c "import sys; sys.path.insert(0,'exe_src'); from gidmg.version import VERSION; print(VERSION)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=Gi DMG v$version" >> "$GITHUB_OUTPUT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Gi-DMG-v${{ steps.meta.outputs.version }}-windows
          path: exe_bin/Gi DMG v${{ steps.meta.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 30

      # 两种回填方式：手动触发时勾选 commit_binary，或在提交信息里带 [commit-exe]
      - name: 提交 EXE 回 exe_bin/
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.commit_binary) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[commit-exe]'))
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "exe_bin/Gi DMG v${{ steps.meta.outputs.version }}.exe"
          if git diff --cached --quiet; then
            echo "EXE 没有变化，跳过提交。"
          else
            git commit -m "构建：更新 exe_bin/Gi DMG v${{ steps.meta.outputs.version }}.exe [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
