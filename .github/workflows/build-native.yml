name: Build native EXE
permissions:
  contents: write
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile static native GUI
        shell: powershell
        run: |
          & cl /nologo /std:c++17 /O2 /MT /utf-8 native/main.cpp '/Fe:exe_bin/Gi DMG v3.0.0.exe' /link /SUBSYSTEM:WINDOWS comctl32.lib comdlg32.lib shell32.lib gdi32.lib user32.lib 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log | ForEach-Object { Write-Output "::error::$($_)" }
            exit $LASTEXITCODE
          }
      - name: Commit compiled EXE to session branch
        if: github.event_name == 'push' && success()
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "exe_bin/Gi DMG v3.0.0.exe"
          git commit -m "更新原生 EXE 构建产物 [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Gi-DMG-v3.0.0-native
          path: |
            exe_bin/Gi DMG v3.0.0.exe
            build.log
