name: Build native Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC x64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Release with MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native/build | Out-Null
          cl.exe /nologo /std:c++17 /O2 /W4 /EHsc /utf-8 /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /DNOMINMAX /MT `
            /Fe:"native/build/Gi DMG v2.2.0.exe" `
            native/src/GiDMG.cpp native/src/model.cpp `
            user32.lib gdi32.lib comctl32.lib comdlg32.lib shell32.lib `
            /link /SUBSYSTEM:WINDOWS
          if ($LASTEXITCODE -ne 0) { throw 'MSVC compilation failed' }

      - name: Verify single-file output
        shell: pwsh
        run: |
          $exe = Get-Item 'native/build/Gi DMG v2.2.0.exe'
          if ($exe.Length -le 0) { throw 'EXE is empty' }
          Write-Host "Built $($exe.FullName) ($($exe.Length) bytes)"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gi-DMG-v2.2.0-windows-x64
          path: native/build/Gi DMG v2.2.0.exe
          if-no-files-found: error
