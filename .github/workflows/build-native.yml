name: Build native Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S native -B native/build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build native/build --config Release --parallel

      - name: Verify single-file output
        shell: pwsh
        run: |
          $exe = Get-Item 'native/build/Release/Gi DMG v2.2.0.exe'
          if ($exe.Length -le 0) { throw 'EXE is empty' }
          Write-Host "Built $($exe.FullName) ($($exe.Length) bytes)"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gi-DMG-v2.2.0-windows-x64
          path: native/build/Release/Gi DMG v2.2.0.exe
          if-no-files-found: error
